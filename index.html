    <!-- BEAUTY PM POPUP -->
    <div id="beautyPMPopup" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9000;align-items:flex-end;justify-content:center;" onclick="if(event.target===this)this.classList.remove('active')">
        <div style="background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:24px 20px 40px;max-height:85vh;overflow-y:auto;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
                <div style="font-size:15px;font-weight:700;letter-spacing:.05em;color:var(--gold);">🌙 PM Routine</div>
                <button onclick="document.getElementById('beautyPMPopup').classList.remove('active')" style="background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;">✕</button>

            <div class="checklist">

                <div class="check-item" onclick="toggleCheck(this)">
                    <div class="check-box"></div>
                    <div style="flex:1;">
                        <div class="check-name">BHA Toner</div>
                        <div class="check-sub">Paula's Choice</div>
                    </div>
                </div>
                <div class="check-item" onclick="toggleCheck(this)">
                    <div class="check-box"></div>
                    <div style="flex:1;">
                        <div class="check-name">Retinol + Collagen</div>
                        <div class="check-sub">Night treatment</div>
                    </div>
                </div>
                <div class="check-item" onclick="toggleCheck(this)">
                    <div class="check-box"></div>
                    <div style="flex:1;">
                        <div class="check-name">Laneige Lip Mask</div>
                    </div>
                </div>
                <div class="check-item" onclick="toggleCheck(this)">
                    <div class="check-box"></div>
                    <div style="flex:1;">
                        <div class="check-name">Castor Oil on Lashes</div>
                    </div>
                </div>
                <div class="check-item" onclick="toggleCheck(this)">
                    <div class="check-box"></div>

    </div>

<!-- ══════════════════════════════════════════
     AFFIRMATIONS MODULE  (single source of truth)
     ══════════════════════════════════════════ -->

<div id="sov-affirmations" style="display:none;position:fixed;inset:0;background:#0a0a0a;z-index:9999;flex-direction:column;overflow:hidden;">

  <!-- ambient glow -->
  <div style="position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(201,169,110,0.055) 0%,transparent 70%);top:45%;left:50%;transform:translate(-50%,-50%);pointer-events:none;"></div>

  <!-- STATE: anchors view -->
  <div id="aff-anchors-view" style="display:flex;flex-direction:column;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;">

    <!-- header -->
    <div style="padding:52px 24px 0;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
      <span style="font-family:'Jost',sans-serif;font-weight:200;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#c9a96e;">Affirmations</span>
      <button onclick="closeSovAffirmations()" style="background:none;border:none;cursor:pointer;font-family:'Cormorant Garamond',serif;font-size:22px;color:rgba(232,224,213,0.45);padding:8px;line-height:1;-webkit-tap-highlight-color:transparent;">✕</button>
    </div>

    <!-- daily anchors -->
    <div style="padding:28px 24px 8px;flex-shrink:0;">
      <div style="font-family:'Jost',sans-serif;font-weight:200;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#c9a96e;margin-bottom:18px;">Daily Anchors</div>
      <div id="aff-anchor-list"></div>
    </div>

    <!-- category grid -->
    <div style="padding:24px 24px 48px;flex-shrink:0;">
      <div style="font-family:'Jost',sans-serif;font-weight:200;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#c9a96e;margin-bottom:16px;">Frequency</div>
      <div id="aff-cat-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;"></div>
    </div>

  </div><!-- /anchors view -->

  <!-- STATE: carousel view (hidden until category tapped) -->
  <div id="aff-carousel-view" style="display:none;flex-direction:column;height:100%;">

    <!-- carousel header -->
    <div style="padding:52px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0;position:relative;z-index:1;">
      <span id="aff-carousel-label" style="font-family:'Jost',sans-serif;font-weight:200;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#c9a96e;"></span>
      <div style="display:flex;align-items:center;gap:16px;">
        <button id="aff-fav-btn" onclick="affToggleFav()" style="background:none;border:none;cursor:pointer;font-size:22px;line-height:1;color:rgba(232,224,213,0.4);transition:color 0.25s;padding:4px;-webkit-tap-highlight-color:transparent;">♡</button>
        <button onclick="affBackToAnchors()" style="background:none;border:none;cursor:pointer;font-family:'Jost',sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(232,224,213,0.4);padding:4px;-webkit-tap-highlight-color:transparent;">← Back</button>
      </div>
    </div>

    <!-- card area -->
    <div style="flex:1;display:flex;align-items:flex-start;justify-content:center;padding:15% 32px 0;overflow:hidden;position:relative;z-index:1;">
      <div style="width:100%;overflow:hidden;">
        <div id="aff-track" style="display:flex;will-change:transform;transition:transform 0.38s cubic-bezier(0.4,0,0.2,1);"></div>
      </div>
    </div>

    <!-- footer -->
    <div style="flex-shrink:0;padding:0 24px 52px;display:flex;flex-direction:column;align-items:center;gap:24px;position:relative;z-index:1;">
      <div style="display:flex;align-items:center;gap:16px;">
        <button onclick="affPrev()" style="background:none;border:none;cursor:pointer;color:rgba(201,169,110,0.3);font-size:24px;padding:10px;font-family:'Cormorant Garamond',serif;line-height:1;transition:color 0.2s;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;">←</button>
        <div id="aff-dots" style="display:flex;gap:7px;align-items:center;"></div>
        <button onclick="affNext()" style="background:none;border:none;cursor:pointer;color:rgba(201,169,110,0.3);font-size:24px;padding:10px;font-family:'Cormorant Garamond',serif;line-height:1;transition:color 0.2s;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;">→</button>
      </div>
      <button
        type="button"
        onclick="affDone()"
        style="width:100%;max-width:280px;padding:15px 0;border-radius:40px;border:0.5px solid rgba(201,169,110,0.35);background:transparent;font-family:'Jost',sans-serif;font-weight:300;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#c9a96e;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;">
        Done
      </button>
    </div>

  </div><!-- /carousel view -->

</div><!-- /sov-affirmations -->

<script>
/* ══════════════════════════════════════════════════════════════
   AFFIRMATIONS MODULE  — isolated, no duplicates
   ══════════════════════════════════════════════════════════════ */
(function() {

  // ── DATA ──────────────────────────────────────────────────────
  var AFF_DAILY = [
    "I am free from the need to please. I am guided by purpose, not pressure.",
    "I think independently. I trust myself. I do not shrink.",
    "Calm. Competent. Significant. Rooted. This is my frequency.",
    "I am the green light. I don't wait for permission."
  ];

  var AFF_CATS = [
    { id:'core',     label:'Core',   icon:'<circle cx="9" cy="9" r="6"/><circle cx="9" cy="9" r="2"/>' },
    { id:'health',   label:'Health', icon:'<path d="M4 9c0-3 2-6 5-6s5 3 5 6c0 4-5 7-5 7s-5-3-5-7z"/>' },
    { id:'wealth',   label:'Wealth', icon:'<circle cx="9" cy="9" r="7"/><path d="M9 5v8M7 7h3a2 2 0 010 4H7"/>' },
    { id:'home',     label:'Home',   icon:'<path d="M3 10l6-7 6 7v6H3z"/><path d="M7 16v-5h4v5"/>' },
    { id:'feminine', label:'Fem',    icon:'<path d="M9 2c-1 3-5 5-5 8a5 5 0 0010 0c0-3-4-5-5-8z"/><path d="M7 11c0 1 1 2 2 2s2-1 2-2"/>' },
    { id:'neuro',    label:'Neuro',  icon:'<path d="M5 9a4 4 0 018 0c0 2-1 3-2 4"/><path d="M9 13v2M7 7c0-1 1-2 2-2s2 1 2 2"/><circle cx="9" cy="15" r="1"/>' },
    { id:'peace',    label:'Peace',  icon:'<circle cx="9" cy="9" r="3"/><path d="M9 2v2M9 14v2M2 9h2M14 9h2M4 4l1.5 1.5M12.5 12.5L14 14M14 4l-1.5 1.5M5.5 12.5L4 14"/>' }
  ];

  var AFF_DATA = {
    core:     ["I am free from the need to please. I am guided by purpose, not pressure.","I think independently. I trust myself. I do not shrink.","Calm. Competent. Significant. Rooted. This is my frequency.","I am the green light. I don't wait for permission."],
    health:   ["My body responds to consistency, nourishment, movement, and rest.","I choose behaviors that protect my future self.","I do not punish my body. I support it.","I am becoming stronger, clearer, healthier, and more energized each day."],
    wealth:   ["I create stability through discipline and aligned action.","I am capable of mastering difficult things.","My opportunities expand as my competence expands.","I move like someone building a legacy, not escaping survival."],
    home:     ["Peace lives in this home because I protect it.","My children experience safety, structure, warmth, and love through me.","I am building a life my future family will be proud of.","My home reflects calm, beauty, growth, and intention."],
    feminine: ["I no longer chase. I align.","I carry myself with softness and certainty.","I am allowed to evolve beyond old versions of myself.","My presence changes rooms before I speak."],
    neuro:    ["I can learn complex things through repetition and presence.","I do not panic in uncertainty. I assess.","My confidence grows through preparation and experience.","I belong in high-level rooms because I earned my place there."],
    peace:    ["I do not have to rush to be worthy.","Rest is productive when it restores me.","My nervous system is learning safety.","I can pause without falling behind."]
  };

  // ── STATE ─────────────────────────────────────────────────────
  var affState = { cat: null, idx: 0, saved: {} };
  var affTouchStartX = null, affTouchStartY = null;

  // ── HELPERS (exposed for openSovSection) ──────────────────────
  function affShowAnchorsView() {
    document.getElementById('aff-anchors-view').style.display = 'flex';
    document.getElementById('aff-carousel-view').style.display = 'none';
  }
  window.affShowAnchorsView = affShowAnchorsView;

  function affRenderAnchors() {
    var el = document.getElementById('aff-anchor-list');
    if (!el) return;
    el.innerHTML = '';
    AFF_DAILY.forEach(function(a) {
      var wrap = document.createElement('div');
      wrap.style.cssText = 'background:linear-gradient(135deg,rgba(201,169,110,0.06),rgba(255,255,255,0.02));border:0.5px solid rgba(201,169,110,0.15);border-radius:12px;padding:16px 18px;margin-bottom:10px;position:relative;overflow:hidden;';
      var bar = document.createElement('div');
      bar.style.cssText = 'position:absolute;top:0;left:0;width:2px;height:100%;background:linear-gradient(180deg,rgba(201,169,110,0.6),rgba(201,169,110,0.1));border-radius:2px 0 0 2px;';
      var text = document.createElement('div');
      text.style.cssText = 'font-family:"Cormorant Garamond",serif;font-weight:300;font-size:15px;line-height:1.65;color:#e8e0d5;padding-left:10px;';
      text.textContent = a;
      wrap.appendChild(bar);
      wrap.appendChild(text);
      el.appendChild(wrap);
    });
  }
  window.affRenderAnchors = affRenderAnchors;

  var AFF_CAT_COLORS = {
    core:     {grad:'linear-gradient(145deg,rgba(201,169,110,0.14),rgba(201,169,110,0.03))', accent:'#c9a96e', border:'rgba(201,169,110,0.3)'},
    health:   {grad:'linear-gradient(145deg,rgba(126,200,160,0.12),rgba(126,200,160,0.02))', accent:'#7ec8a0', border:'rgba(126,200,160,0.25)'},
    wealth:   {grad:'linear-gradient(145deg,rgba(232,201,122,0.12),rgba(232,201,122,0.02))', accent:'#e8c97a', border:'rgba(232,201,122,0.25)'},
    home:     {grad:'linear-gradient(145deg,rgba(180,143,212,0.12),rgba(180,143,212,0.02))', accent:'#b48fd4', border:'rgba(180,143,212,0.25)'},
    feminine: {grad:'linear-gradient(145deg,rgba(212,143,160,0.12),rgba(212,143,160,0.02))', accent:'#d48fa0', border:'rgba(212,143,160,0.25)'},
    neuro:    {grad:'linear-gradient(145deg,rgba(138,180,212,0.12),rgba(138,180,212,0.02))', accent:'#8ab4d4', border:'rgba(138,180,212,0.25)'},
    peace:    {grad:'linear-gradient(145deg,rgba(160,180,200,0.12),rgba(160,180,200,0.02))', accent:'#a0b4c8', border:'rgba(160,180,200,0.25)'}
  };
  function affRenderCats() {
    var el = document.getElementById('aff-cat-grid');
    if (!el) return;
    el.innerHTML = '';
    AFF_CATS.forEach(function(c) {
      var col = AFF_CAT_COLORS[c.id] || AFF_CAT_COLORS.core;
      var btn = document.createElement('button');
      btn.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:12px;border:0.5px solid ' + col.border + ';background:' + col.grad + ';cursor:pointer;font-family:"Jost",sans-serif;font-weight:300;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:' + col.accent + ';-webkit-tap-highlight-color:transparent;transition:all 0.25s;';
      btn.onclick = (function(id){ return function(){ affOpenCat(id); }; })(c.id);
      var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('viewBox','0 0 18 18');
      svg.setAttribute('fill','none');
      svg.setAttribute('stroke', col.accent);
      svg.setAttribute('stroke-width','1.2');
      svg.setAttribute('stroke-linecap','round');
      svg.setAttribute('stroke-linejoin','round');
      svg.style.cssText = 'width:18px;height:18px;flex-shrink:0;';
      svg.innerHTML = c.icon;
      var span = document.createElement('span');
      span.textContent = c.label;
      btn.appendChild(svg);
      btn.appendChild(span);
      el.appendChild(btn);
    });
  }
  window.affRenderCats = affRenderCats;

  // ── OPEN (called by openSovSection) ───────────────────────────
  window.openSovAffirmations = function() {
    var el = document.getElementById('sov-affirmations');
    if (el) { el.style.display = 'flex'; document.body.style.overflow = 'hidden'; }
    affShowAnchorsView();
    affRenderAnchors();
    affRenderCats();
  };

  // ── CLOSE (X button) ─────────────────────────────────────────
  window.closeSovAffirmations = function() {
    var el = document.getElementById('sov-affirmations');
    if (el) el.style.display = 'none';
    document.body.style.overflow = '';
    var chk = document.getElementById('sov-check-affirmations');
    if (chk) chk.classList.add('done');
    if (typeof showToast === 'function') showToast('Affirmations complete ✓');
  };

  // ── DONE button (carousel footer) ────────────────────────────
  window.affDone = function() {
    var chk = document.getElementById('sov-check-affirmations');
    if (chk) chk.classList.add('done');
    if (typeof showToast === 'function') showToast('Affirmations complete ✓');
    affShowAnchorsView();
  };

  // ── BACK button (carousel header) ────────────────────────────
  window.affBackToAnchors = function() {
    affShowAnchorsView();
  };

  // ── CAROUSEL ─────────────────────────────────────────────────
  window.affOpenCat = function(catId) {
    affState.cat = catId;
    affState.idx = 0;
    var cat = AFF_CATS.find(function(c){ return c.id === catId; });
    document.getElementById('aff-carousel-label').textContent = cat ? cat.label : '';
    affRenderTrack();
    affRenderDots();
    affSetTrackPos(false);
    affUpdateFav();
    document.getElementById('aff-anchors-view').style.display = 'none';
    var cv = document.getElementById('aff-carousel-view');
    cv.style.display = 'flex';
    cv.style.flexDirection = 'column';
    cv.ontouchstart = function(e){ affTouchStartX = e.touches[0].clientX; affTouchStartY = e.touches[0].clientY; };
    cv.ontouchend   = function(e){
      if (affTouchStartX === null) return;
      var dx = e.changedTouches[0].clientX - affTouchStartX;
      var dy = Math.abs(e.changedTouches[0].clientY - affTouchStartY);
      if (Math.abs(dx) > 50 && Math.abs(dx) > dy) { dx < 0 ? window.affNext() : window.affPrev(); }
      affTouchStartX = null;
    };
  };

  function affRenderTrack() {
    var track = document.getElementById('aff-track');
    if (!track) return;
    var items = AFF_DATA[affState.cat] || [];
    track.innerHTML = items.map(function(text) {
      return '<div style="min-width:100%;display:flex;align-items:flex-start;justify-content:center;padding:0 8px;">'
        + '<p style="font-family:\'Cormorant Garamond\',serif;font-style:italic;font-weight:300;font-size:clamp(22px,6.5vw,30px);line-height:1.55;text-align:center;color:#e8e0d5;position:relative;padding:0 20px;">'
        + '“' + text + '”'
        + '</p></div>';
    }).join('');
  }

  function affRenderDots() {
    var el = document.getElementById('aff-dots');
    if (!el) return;
    var items = AFF_DATA[affState.cat] || [];
    el.innerHTML = items.map(function(_, i) {
      var active = i === affState.idx;
      return '<button onclick="affGoTo(' + i + ')" style="'
        + 'width:' + (active ? '20px' : '4px') + ';height:4px;border-radius:' + (active ? '3px' : '50%') + ';'
        + 'background:' + (active ? '#c9a96e' : 'rgba(201,169,110,0.2)') + ';'
        + 'border:none;cursor:pointer;padding:0;transition:all 0.3s;-webkit-tap-highlight-color:transparent;"></button>';
    }).join('');
  }

  function affSetTrackPos(animate) {
    var track = document.getElementById('aff-track');
    if (!track) return;
    track.style.transition = animate ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
    track.style.transform = 'translateX(-' + (affState.idx * 100) + '%)';
  }

  function affUpdateFav() {
    var btn = document.getElementById('aff-fav-btn');
    if (!btn) return;
    var key = affState.cat + '-' + affState.idx;
    var isSaved = !!affState.saved[key];
    btn.textContent = isSaved ? '♥' : '♡';
    btn.style.color = isSaved ? '#c9a96e' : 'rgba(232,224,213,0.4)';
  }

  window.affToggleFav = function() {
    var key = affState.cat + '-' + affState.idx;
    affState.saved[key] = !affState.saved[key];
    affUpdateFav();
  };

  window.affGoTo = function(i) {
    var items = AFF_DATA[affState.cat] || [];
    if (i < 0 || i >= items.length) return;
    affState.idx = i;
    affSetTrackPos(true);
    affRenderDots();
    affUpdateFav();
  };

  window.affPrev = function() { window.affGoTo(affState.idx - 1); };
  window.affNext = function() { window.affGoTo(affState.idx + 1); };

})();
/* ══ end affirmations module ══ */
</script>
